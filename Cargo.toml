[package]
name = "light_novel_translator_iced"
version = "1.2.0"
edition = "2024"

[dependencies]
fast_html2md = "0.0.63"
iced = { version = "0.14.0", features = ["advanced", "debug", "image", "lazy", "markdown", "svg", "tokio"] }
iced_aw = { version = "0.14.1", default-features = false, features = ["context_menu", "typed_input", "menu", "tab_bar", "card", "number_input"] }
log = "0.4.35" 
percent-encoding = "2.3.2"
phf = { version = "0.13.1", features = ["macros"] }
pulldown-cmark = "0.13.6"
quick-xml = { version = "0.42.0", features = ["escape-html"] }
rayon = "1.12.0"
rbook = "0.7.12"
regex = "1.13"
reqwest-middleware = "0.5.2"
reqwest-retry = "0.9.1"
rfd = { version = "0.17.2", features = ["xdg-portal"] }
rig = { version = "0.45.0", features = ["agent", "memory", "reqwest-middleware"] }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
